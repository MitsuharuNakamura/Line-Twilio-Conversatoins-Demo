steps:
  # 依存関係インストール
  - name: 'node:20'
    entrypoint: npm
    args: ['install', '-g', 'pnpm@latest']

  - name: 'node:20'
    entrypoint: pnpm
    args: ['install']

  # sharedパッケージのビルド
  - name: 'node:20'
    entrypoint: pnpm
    args: ['--filter', '@line-twilio-chat/shared', 'build']

  # middlewareパッケージのビルド
  - name: 'node:20'
    entrypoint: pnpm
    args: ['--filter', '@line-twilio-chat/middleware', 'build']

  # Cloud Runにデプロイ
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'line-twilio-chat-middleware'
      - '--source=packages/middleware'
      - '--platform=managed'
      - '--region=asia-northeast1'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=60s'
      - '--max-instances=10'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
